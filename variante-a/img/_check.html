<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#F5EDE0;font-family:sans-serif;color:#122D24;padding:24px}
.row{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;margin-bottom:28px}
.box{background:#FBF8F3;border:1px solid #E2D7C4;border-radius:14px;padding:14px;text-align:center}
.box img{display:block;margin:0 auto 8px}
b{font-size:13px}
.wide{width:100%;background:#FBF8F3;border:1px solid #E2D7C4;border-radius:14px;padding:14px;text-align:center}
</style></head><body>
<div class="row">
  <div class="box"><img src="orn-mussel-lg.svg" width="300"><b>Grünlippmuschel</b></div>
  <div class="box"><img src="orn-ginger.svg" width="280"><b>Ingwer</b></div>
  <div class="box"><img src="orn-claw.svg" width="230"><b>Teufelskralle</b></div>
  <div class="box"><img src="orn-kelp.svg" height="300"><b>Kelp</b></div>
  <div class="box"><img src="orn-leaf-spray.svg" height="300"><b>Blattzweig</b></div>
</div>
<div class="wide"><img src="orn-garland.svg" width="1100"><b>Girlande (waagerecht)</b></div>
</body></html>
